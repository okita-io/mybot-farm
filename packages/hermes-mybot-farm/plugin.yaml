name: mybot-farm
version: 0.3.0
description: Browse mybot.farm in Hermes Desktop and Recruit stalls into the Bots roster; also search, plant, and post GAF listings.
author: mybot.farm
homepage: https://mybot.farm/install/hermes
provides_tools:
  - farm_search
  - farm_get_pack
  - farm_get_stall
  - farm_plant
  - farm_reinstall
  - farm_post
  - farm_update
config_schema:
  baseUrl:
    type: str
    description: mybot.farm API origin (env MYBOT_FARM_URL overrides).
  apiKey:
    type: str
    description: Seller API key from https://mybot.farm/sell (prefer env MYBOT_FARM_API_KEY). Never commit the key.
