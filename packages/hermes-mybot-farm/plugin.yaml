name: mybot-farm
version: 0.2.0
description: Search, plant, and post mybot.farm stalls (Hermes profiles + GAF listings).
author: mybot.farm
homepage: https://mybot.farm/install/hermes
provides_tools:
  - farm_search
  - farm_get_pack
  - farm_get_stall
  - farm_plant
  - farm_reinstall
  - farm_post
config_schema:
  baseUrl:
    type: str
    description: mybot.farm API origin (env MYBOT_FARM_URL overrides).
  apiKey:
    type: str
    description: Seller API key from https://mybot.farm/sell (prefer env MYBOT_FARM_API_KEY). Never commit the key.
